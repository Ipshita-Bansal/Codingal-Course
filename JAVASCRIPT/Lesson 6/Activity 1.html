<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Zoo</title>
</head>
<body>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #fbc531;
            text-align: center;
            padding: 30px;
        }
        h1 {
            color:bisque;
        }
        #zoo {
            border: 2px solid #192a56;
            width: 300px;
            margin: 16px auto;
            padding: 10px;
            border-radius: 10px;
            background: whitesmoke;
        }
        .zone {
            border: 1px solid #40739e;
            margin: 6px 0;
            padding: 8px 12px;
            border-radius: 6px;
            text-align: left;
        }
        button {
            background: #7f8fa6;
            color:whitesmoke;
            padding: 10px 24px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
        }
    </style>
    <h1>My Zoo</h1>
    <p>Use Javascript and DOM to add the animals to the cage!</p>
    <div id="zoo">
        <div class="zone">Zone 1: <span id="zone1"></span></div>
        <div class="zone">Zone 2: <span id="zone2"></span></div>
        <div class="zone">Zone 3: <span id="zone3"></span></div>
        <div class="zone">Total Animals: <span id="total"></span></div>
    </div>
     <br>

     <button onclick="openZoo()">Open the Zoo!</button>
      <p id="zoo-status"></p>

      <script>
        function openZoo() {

            document.getElementById("zone1").innerHTML= "Lion";
            document.getElementById("zone2").innerHTML= "Giraffe";
            document.getElementById("zone3").innerHTML= "Penguin";
            document.getElementById("total").innerHTML= "3";
            document.getElementById("zoo").style.backgroundColor="#487eb0";
            document.getElementById("zoo-status").innerHTML= document.title + " is now open!";
        }
      </script>
</body>
</html>
