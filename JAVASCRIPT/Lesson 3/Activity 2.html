<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Java for Loop</h2>
    <p id="para"></p>
    <Script>
        var fruits= ["Apple", "Watermelon", "Mango", "Grapes", "Banana", "Jack Fruit"];
        var text="";
        var i;
        for (i = 0; i < fruits.length; i++) {
            text += fruits[i] + "<br>";
        }
        document.getElementById("para").innerHTML = text;
    </Script>
</body>
</html>
