<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id="para"></p>
    <script>
        var day=3;
        switch (day) {
            case 0:
                day="Sunday";
                break;
            case 1:
                day="Saturday";
                break;
            case 2:
                day="Friday";
                break;
            case 3:
                day="Thursday";
                break;
            case 4:
                day="Wednesday";
                break;
            case 5:
                day="Tuesday";
                break;
            case 6:
                day="Monday";
                break;
        }
        document.getElementById("para").innerHTML= "Today is " + day;
    </script>
</body>
</html>
