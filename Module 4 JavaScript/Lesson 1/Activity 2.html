<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 id="myheading"></h1>
    <p id="mypara"></p>
    <script>
        let name="Ipshita Bansal";
        let age=13;
        // hard way :[ (string concatenation)
        document.getElementById("myheading").innerHTML="My name is " + name + " and I am " + age + " years old";
        // easy way :] (string interpolation)
        document.getElementById("myheading").innerHTML=`My name is ${name} and im ${age} years old :]`    

        let x = 10;
        let y = 10;
        document.getElementById("mypara").innerHTML= x==y;
        // 1 = ASSIGNMENT OPERATOR
        // 2 = EQUALITY OPERATOR
        // COMPARISON OPERATORS (< > == >=) ALWAYS GIVE TRUE/FALSE RESULT
    </script>
</body>
</html>
