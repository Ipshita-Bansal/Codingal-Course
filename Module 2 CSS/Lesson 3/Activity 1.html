<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Module 2 - Lesson 3 Activity 1 - My Superhero Card</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Germania+One&display=swap" rel="stylesheet"><style>
      /* Typography — font, size, weight, colour for the whole page */
      body {
        background-color: rgb(39, 75, 147);
        color: rgba(231, 55, 55, 0.735);
        font-family: "Germania One";
      }


      /* Typography + Text Shadow — big bold title with an orange shadow */
      .hero-name {
        font-size: 60px;
        font-weight: 900;
        text-shadow: 5px 5px 5px rgb(12, 38, 165), 6px 6px  rgba(238, 255, 1, 0.826);
      }


      /* Typography + Text Transform — tagline becomes Title Case */
      .tagline {
        font-style: italic;
        color:rgb(175, 14, 14);
        text-transform: capitalize;
      }


      /* Text Transform + Text Decoration — section headings in CAPS with underline */
      .label {
        text-transform: uppercase;
        text-decoration: underline dashed;
      }


      /* Typography — powers stand out in bold green */
      .power {
    color:darkblue  
    }


      /* Text Decoration — weaknesses are crossed out */
      .weakness {
        color: rgb(111, 111, 9);
        text-decoration: line-through;
      }


      /* Transform — the badge is tilted to the side */
      .badge {
        color: black;
        background-color: gold;
        font-size: 28px;
        font-weight: bold;
        padding: 8px;
        transform: rotate(200deg);
        display:inline-block;
        margin: 30px 0;
        transition: all 1s ease-in;
    }
    .badge:hover {
    letter-spacing: 5px;
    transform: rotate(20deg);
    }

      /* Typography — footer text */
      .made-by {
        color: coral;
      }

    </style>
  </head>
  <body>
    <h1 class="hero-name">Thunder Kid</h1>
    <p class="tagline">the most powerful hero in the school</p>

    <h2 class="label">super powers</h2>
    <p class="power">Can run faster than a cheetah</p>
    <p class="power">Can lift a school bus</p>

    <h2 class="label">weaknesses</h2>
    <p class="weakness">Maths homework</p>
    <p class="weakness">Broccoli</p>

    <div class="badge">Best Superhero</div>

    <p class="made-by">Created by Ipshita Bansal</p>
  </body>
</html>
