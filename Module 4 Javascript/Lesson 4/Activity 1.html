<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Phone Contact</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
 </head>
 <style>
    body { background-color: #F0F0F2; }
    h1 { color: #FF5A43; }
    .card-label { font-size: 11px; color: #999; text-transform: uppercase; }
    pre { font-size: 13px; color: #333; }
 </style>
<body class="py-4">

    <div class="container"?

    <h1 class="mb-1">My Phone Contact</h1>
    <p class="text-muted mb-4">
        Introduction to Objects in Javascript - Grade 4-6
    </p>
     
    <div class="card shadow-sm mb-3" style="max-width:400px;">
        <div class="card-body">
            <h5 class="card-title" style="color:black">Contact Deatils</h5>
            <ul class="list-group list-group-flush">
                <li class="list-group-item">
                    <span class="card-label d-block">Name</span>
                    <Strong id="name">-</Strong>
                </li>
                <li class="list-group-item">
                    <span class="card-label d-block">Phone</span>
                    <Strong id="phone">-</Strong>
                </li>
                <li class="list-group-item">
                    <span class="card-label d-block">School</span>
                    <Strong id="school">-</Strong>
                </li>
                <li class="list-group-item">
                    <span class="card-label d-block">City</span>
                    <Strong id="city">-</Strong>
                </li>
            </ul>
        </div>
    </div>

    <div class="card shadow-sm" style="max-width:400px;">
        <div class="card-body">
            <h6 style="color:antiquewhite">Javascript Object Used</h6>
            <pre id="codeDisplay"
            class="bg-light p-3 rounded border mb-0"></pre>
        </div>
    </div>
</body>
</html>
