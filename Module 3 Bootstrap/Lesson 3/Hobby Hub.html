<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    />
    <title>My Hobby Hub</title>
  </head>
  <body>
    <!-- container-fluid: stretches to fill the full width of the screen -->
    <header class="container-fluid bg-primary-subtle p-4 text-success-emphasis">
      <h1>My Hobby Hub</h1>
      <p>A page about the things I love to do!</p>
    </header>

    <main class="container d-flex gap-2">
      <!-- container: keeps content centred and neat on the page -->
      <!-- bg-success: green background, white text -->
       <div class="bg-success-subtle p-4 my-4 border border-dark border-3 shadow-lg">
        <h2>Playing Games</h2>
        <p>Because its great ✌️</p>
       </div>
       <div class="bg-danger-subtle p-4 my-4 border border-dark border-3 shadow-lg">
        <h2>Playing Basketball</h2>
        <p>Because I'm great at it 😁</p>
       </div>
       <div class="bg-dark-subtle p-4 my-4 border border-dark border-3 shadow-lg">
        <h2>IDK</h2>
        <p>Because idk 🤗😊😶‍🌫️😬😭😁😭</p>
       </div>
       <div class="bg-info-subtle p-4 my-4 border border-dark border-3 shadow-lg">
        <h2>Something</h2>
        <p>Because why not 🥰😁😆😉😊🤗🙂😐😶‍🌫️😕😬😭🧐</p>
       </div>
       <div class="p-4 my-4 border border-dark border-3 shadow-lg">
        <h2>Playing Tennis</h2>
        <p>Because I'm amazing 🔥</p>
       </div>
    </main>

    <!-- container-fluid footer: full-width dark bar at the bottom -->
    <footer class="container-fluid bg-warning-subtle p-2 text-primary-emphasis">
      <p>Made with Bootstrap — My Hobby Hub</p>
    </footer>
  </body>
</html>
