<!DOCTYPE html>
<html>
<head>
  <title>School Club Website</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background-color: #f4f6f9;
      font-family: Arial, sans-serif;
      padding: 40px 15px;
    }
    h1 {
      text-align: center;
      color: #333;
      font-weight: bold;
      margin-bottom: 30px;
    }
    .club-card {
      text-align: center;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 25px;
      margin-bottom: 20px;
      background-color: #ffffff;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.05);
    }
    .club-card h3 {
      color: #ff5a43;
      font-weight: bold;
      margin-bottom: 15px;
    }
    .club-card p {
      color: #555;
      margin-bottom: 20px;
    }
    .btn-primary {
      background-color: #ff5a43;
      border: none;
      padding: 8px 20px;
      border-radius: 5px;
    }
    .btn-primary:hover {
      background-color: #e04832;
    }
  </style>
</head>
<body>

  <h1>My School Clubs</h1>

  <div class="container">

    <div class="row">

      <div class="col-12 col-md-6 col-lg-4">
        <div class="club-card">
          <h3>Coding Club</h3>
          <p>I learn how to create websites, games, and simple apps.</p>
          <a href="#" class="btn btn-primary">Join Club</a>
        </div>
      </div>

      <div class="col-12 col-md-6 col-lg-4">
        <div class="club-card">
          <h3>Science Club</h3>
          <p>I enjoy doing experiments and discovering how things work.</p>
          <a href="#" class="btn btn-primary">Join Club</a>
        </div>
      </div>

      <div class="col-12 col-md-12 col-lg-4">
        <div class="club-card">
          <h3>Art Club</h3>
          <p>I love drawing, painting, and creating colourful designs.</p>
          <a href="#" class="btn btn-primary">Join Club</a>
        </div>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
